<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stellenwerttafel</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;-webkit-user-select:none;user-select:none;}
  #wrap{height:100%;display:flex;flex-direction:column;padding:10px;gap:8px;}
  #types{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .tbtn{padding:7px 12px;border:1px solid #cfd6e0;border-radius:9px;background:#fff;font-size:14px;font-family:inherit;cursor:pointer;font-weight:600;}
  .tbtn.on{background:#3b82f6;color:#fff;border-color:#3b82f6;}
  .hint{font-size:12px;color:#8a93a2;}
  #tafelWrap{flex:1;min-height:0;overflow:auto;}
  #tafel{display:inline-flex;flex-direction:column;min-width:100%;}
  .row{display:flex;align-items:stretch;}
  .ugroup{display:flex;flex-direction:column;flex:none;}
  .uhead{text-align:center;font-size:calc(var(--fs,22px)*0.64);padding:5px 4px;cursor:pointer;white-space:nowrap;color:#334155;font-weight:var(--fwh,700);border-radius:8px 8px 0 0;}
  .ugroup.sel .uhead{color:#fff;background:#dc2626;}
  .udigits{display:flex;}
  .dc{width:calc(var(--fs,22px)*1.64);height:calc(var(--fs,22px)*2.2);text-align:center;font-size:var(--fs,22px);font-weight:var(--fw,400);font-style:var(--fi,normal);border:1px solid #cbd3df;border-left:none;border-top:none;font-family:inherit;background:#fff;color:#1f2430;padding:0;}
  .ugroup .udigits .dc:first-child{border-left:1px solid #cbd3df;}
  .ugroup.sel .dc{border-color:#dc2626;}
  .comma{width:calc(var(--fs,22px)*0.73);flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:calc(var(--fs,22px)*1.8);font-weight:900;color:#dc2626;line-height:.5;padding-bottom:4px;}
  .comma.head{align-items:flex-end;color:#dc2626;font-size:calc(var(--fs,22px)*0.72);}
  .ugroup.mk .dc{border-bottom:3px solid #16a34a;}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin-left:4px;color:#15803d;font-variant-numeric:tabular-nums;}
  .frac span:first-child{align-self:stretch;text-align:center;border-bottom:2px solid currentColor;padding:0 3px;}
  .frac span:last-child{padding:0 3px;}
  .comma.pct{color:#2563eb;}
  .comma.head.pct{color:#2563eb;font-weight:800;}
  .rowend{display:flex;align-items:center;gap:8px;padding-left:12px;flex:none;}
  .rval{font-size:calc(var(--fs,22px)*0.73);font-weight:800;white-space:nowrap;}
  .rval b{color:#dc2626;}
  .del{border:none;background:#f1f3f7;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;color:#64748b;}
  #foot{display:flex;gap:10px;align-items:center;}
  #add{padding:8px 14px;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div id="wrap">
  <div id="types">
    <button class="tbtn" id="t-zahl">Zahl</button>
    <button class="tbtn" id="t-laenge">Längen</button>
    <button class="tbtn" id="t-flaeche">Flächen</button>
    <button class="tbtn" id="t-volumen">Volumen</button>
    <button class="tbtn" id="t-masse">Massen</button>
    <button class="tbtn" id="t-pct" title="Zweites Komma an der Hundertstel-Stelle → Prozent-Darstellung" style="display:none">%-Komma</button>
    <button class="tbtn" id="t-bruch" title="Zahl als Bruch – Nenner = markierte Stelle (Stelle vorher antippen)" style="display:none">Bruch</button>
    <span class="hint">Ziffern eintippen · auf eine Einheit tippen verschiebt das Komma (bei „Zahl" fest nach den Einern)</span>
  </div>
  <div id="tafelWrap"><div id="tafel"></div></div>
  <div id="foot"><button id="add">＋ Zeile</button></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const UNITS={
  laenge:[['km',1],['hm',1],['dam',1],['m',1],['dm',1],['cm',1],['mm',1]],
  flaeche:[['km²',2],['ha',2],['a',2],['m²',2],['dm²',2],['cm²',2],['mm²',2]],
  volumen:[['m³',3],['dm³',3],['cm³',3],['mm³',3]],
  masse:[['t',3],['kg',3],['g',3],['mg',3]],
  zahl:[['M',1],['HT',1],['ZT',1],['T',1],['H',1],['Z',1],['E',1],['z',1],['h',1],['t',1],['zt',1],['ht',1],['m',1]]
};
const DEFIDX={ laenge:3, flaeche:3, volumen:0, masse:1, zahl:6 };   // m / m² / m³ / kg / Einer (Komma fest)
let data={ type:'laenge', unitIndex:3, rows:[{dig:{}}], fontSize:22, pct:false, mark:null, bruch:false };
const EIDX=UNITS.zahl.findIndex(u=>u[0]==='E');   // Einer-Stelle
const PCT_IDX=UNITS.zahl.findIndex(u=>u[0]==='h');   // Hundertstel-Stelle = Prozent-Komma
function cellW(){ return Math.round((data.fontSize||22)*1.64); }
function applyFont(){ const r=document.documentElement.style; r.setProperty('--fs',(data.fontSize||22)+'px'); r.setProperty('--fw',data.fontBold?'700':'400'); r.setProperty('--fwh',data.fontBold?'900':'700'); r.setProperty('--fwm',data.fontBold?'800':'600'); r.setProperty('--fi',data.fontItalic?'italic':'normal'); }
function rowValue(dig,split){ if(split===undefined)split=data.unitIndex; const units=UNITS[data.type]; let intP='',fracP='',col=0;
  units.forEach((u,ui)=>{ for(let k=0;k<u[1];k++){ const d=dig[col]||'0'; if(ui<=split)intP+=d; else fracP+=d; col++; } });
  intP=intP.replace(/^0+(?=\d)/,''); if(intP==='')intP='0'; fracP=fracP.replace(/0+$/,'');
  return intP+(fracP?(','+fracP):''); }
function render(){ applyFont();
  ['laenge','flaeche','volumen','masse','zahl'].forEach(t=>$('t-'+t).classList.toggle('on',data.type===t));
  const isZ=data.type==='zahl'; $('t-pct').style.display=isZ?'':'none'; $('t-pct').classList.toggle('on',isZ&&!!data.pct); const showPct=isZ&&!!data.pct;
  $('t-bruch').style.display=(isZ&&data.mark!==null)?'':'none'; $('t-bruch').classList.toggle('on',isZ&&!!data.bruch); const mk=(isZ&&data.mark!==null)?data.mark:-1;
  const units=UNITS[data.type]; const wrap=$('tafel'); wrap.innerHTML='';
  // Kopfzeile
  const head=document.createElement('div'); head.className='row';
  units.forEach((u,ui)=>{ const g=document.createElement('div'); g.className='ugroup'+(ui===data.unitIndex?' sel':'')+(ui<=mk?' mk':'');
    const h=document.createElement('div'); h.className='uhead'; h.style.width=(u[1]*cellW())+'px'; h.innerHTML=u[0]; h.onclick=()=>{ if(data.type==='zahl'){ data.mark=(data.mark===ui)?null:ui; render(); sync(); return; } data.unitIndex=ui; render(); sync(); };
    g.appendChild(h); head.appendChild(g);
    if(ui===data.unitIndex){ const cm=document.createElement('div'); cm.className='comma head'; cm.textContent='▾'; head.appendChild(cm); }
    if(showPct&&ui===PCT_IDX){ const cm=document.createElement('div'); cm.className='comma head pct'; cm.textContent='%'; cm.title='Prozent-Komma'; head.appendChild(cm); } });
  wrap.appendChild(head);
  // Datenzeilen
  data.rows.forEach((rw,ri)=>{ let col=0; const row=document.createElement('div'); row.className='row';
    units.forEach((u,ui)=>{ const g=document.createElement('div'); g.className='ugroup'+(ui===data.unitIndex?' sel':'')+(ui<=mk?' mk':'');
      const dg=document.createElement('div'); dg.className='udigits';
      for(let k=0;k<u[1];k++){ const c=col; const inp=document.createElement('input'); inp.className='dc'; inp.type='text'; inp.inputMode='numeric'; inp.maxLength=1; inp.value=rw.dig[c]||'';
        inp.oninput=()=>{ inp.value=inp.value.replace(/[^0-9]/g,'').slice(0,1); if(inp.value)rw.dig[c]=inp.value; else delete rw.dig[c]; updateVals(); sync(); };
        dg.appendChild(inp); col++; }
      g.appendChild(dg); row.appendChild(g);
      if(ui===data.unitIndex){ const cm=document.createElement('div'); cm.className='comma'; cm.textContent=','; row.appendChild(cm); }
      if(showPct&&ui===PCT_IDX){ const cm=document.createElement('div'); cm.className='comma pct'; cm.textContent=','; row.appendChild(cm); } });
    const end=document.createElement('div'); end.className='rowend';
    const val=document.createElement('div'); val.className='rval'; val.dataset.ri=ri; end.appendChild(val);
    const del=document.createElement('button'); del.className='del'; del.textContent='×'; del.title='Zeile löschen'; del.onclick=()=>{ if(data.rows.length>1){ data.rows.splice(ri,1); render(); sync(); } };
    end.appendChild(del); row.appendChild(end); wrap.appendChild(row); });
  updateVals();
}
function fracOf(dig){ const m=data.mark; if(m===null||m===undefined)return null; const units=UNITS.zahl; let num='',col=0;
  for(let ui=0;ui<=m;ui++){ for(let k=0;k<units[ui][1];k++){ num+=(dig[col]||'0'); col++; } }
  num=num.replace(/^0+(?=\d)/,''); if(num==='')num='0'; const den=m>EIDX?('1'+'0'.repeat(m-EIDX)):'1'; return {num,den}; }
function updateVals(){ const units=UNITS[data.type]; document.querySelectorAll('.rval').forEach(el=>{ const rw=data.rows[+el.dataset.ri]; if(rw){ let h='= '+rowValue(rw.dig)+(data.type==='zahl'?'':' <b>'+units[data.unitIndex][0]+'</b>'); if(data.type==='zahl'&&data.pct) h+=' = <span style="color:#2563eb">'+rowValue(rw.dig,PCT_IDX)+' %</span>'; if(data.type==='zahl'&&data.bruch){ const f=fracOf(rw.dig); if(f) h+=' = <span class="frac"><span>'+f.num+'</span><span>'+f.den+'</span></span>'; } el.innerHTML=h; } }); }
['laenge','flaeche','volumen','masse','zahl'].forEach(t=>$('t-'+t).onclick=()=>{ data.type=t; data.unitIndex=DEFIDX[t]; data.rows=data.rows.map(()=>({dig:{}})); data.mark=null; data.bruch=false; render(); sync(); });
$('add').onclick=()=>{ data.rows.push({dig:{}}); render(); sync(); };
$('t-pct').onclick=()=>{ data.pct=!data.pct; render(); sync(); };
$('t-bruch').onclick=()=>{ data.bruch=!data.bruch; render(); sync(); };
function sync(){ try{ parent.postMessage({type:'embed-data',data},'*'); }catch(e){} }
addEventListener('message',e=>{ if(e.data&&e.data.type==='embed-data'&&e.data.data){ const d=e.data.data;
  data={ type:UNITS[d.type]?d.type:'laenge', unitIndex:(d.unitIndex|0), rows:(Array.isArray(d.rows)&&d.rows.length?d.rows.map(r=>({dig:(r&&r.dig)||{}})):[{dig:{}}]), fontSize:d.fontSize||22, fontBold:!!d.fontBold, fontItalic:!!d.fontItalic, pct:!!d.pct, mark:(typeof d.mark==='number'&&d.mark>=0)?d.mark:null, bruch:!!d.bruch };
  if(data.unitIndex>=UNITS[data.type].length||data.unitIndex<0) data.unitIndex=DEFIDX[data.type]; render(); } });
window.addEventListener('load',()=>{ render(); try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
</script>
</body>
</html>
