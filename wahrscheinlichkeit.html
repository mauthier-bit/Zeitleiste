<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wahrscheinlichkeitsrechner</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  #tabs{display:flex;gap:0;border-bottom:1px solid #e6eaf0;flex:none;}
  #tabs button{flex:1;border:none;background:#f4f6fa;padding:9px;font-size:14px;font-weight:600;cursor:pointer;color:#5b6472;}
  #tabs button.on{background:#fff;color:#2563eb;box-shadow:inset 0 -2px 0 #2563eb;}
  #panel{flex:none;padding:8px 10px;display:flex;flex-direction:column;gap:7px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;}
  .row label{font-weight:600;}
  input,select{padding:6px 8px;border:1px solid #cfd6e0;border-radius:7px;font-size:15px;font-family:inherit;-webkit-user-select:text;user-select:text;}
  input{width:76px;text-align:center;}
  #res{font-size:calc(var(--fs,13px)*1.5);font-weight:var(--fwh,700);font-style:var(--fi,normal);color:#2563eb;}
  #stat{font-size:12px;color:#8a93a2;}
  #chartWrap{flex:1;position:relative;min-height:0;border-top:1px solid #eef1f6;}
  canvas{position:absolute;inset:0;width:100%;height:100%;}
  #binTable{flex:1;min-height:0;overflow:auto;border-top:1px solid #eef1f6;display:none;}
  .vt{width:100%;border-collapse:collapse;font-size:var(--fs,13px);font-weight:var(--fw,400);font-style:var(--fi,normal);}
  .vt th{position:sticky;top:0;background:#f4f6fa;padding:6px;border-bottom:1px solid #e2e7ef;font-size:calc(var(--fs,13px)*0.9);color:#5b6472;}
  .vt td{padding:4px 6px;text-align:center;border-bottom:1px solid #f0f3f8;font-variant-numeric:tabular-nums;}
  .vt tr.hl td{background:#e8f0fe;font-weight:var(--fwm,600);color:#1e40af;}
</style>
</head>
<body>
<div id="app">
  <div id="tabs"><button id="tabB" class="on">Binomial</button><button id="tabN">Normal</button></div>
  <div id="panel">
    <!-- Binomial -->
    <div id="pB">
      <div class="row"><label>n =</label><input id="n" type="number" min="1" value="20"><label>p =</label><input id="p" type="number" step="0.01" value="0.5"></div>
      <div class="row"><label>P( X</label><select id="opB"><option value="=">=</option><option value="≤" selected>≤</option><option value="<">&lt;</option><option value="≥">≥</option><option value=">">&gt;</option><option value="zw">zwischen</option></select><input id="kB" type="number" value="10"><span id="kB2wrap" style="display:none">…<input id="kB2" type="number" value="15"></span><label>)</label></div>
    </div>
    <!-- Normal -->
    <div id="pN" style="display:none">
      <div class="row"><label>μ =</label><input id="mu" type="number" value="0"><label>σ =</label><input id="sig" type="number" step="0.1" value="1"></div>
      <div class="row"><label>P( X</label><select id="opN"><option value="≤" selected>≤</option><option value="≥">≥</option><option value="zw">zwischen</option></select><input id="xN" type="number" value="1"><span id="xN2wrap" style="display:none">…<input id="xN2" type="number" value="2"></span><label>)</label></div>
    </div>
    <div class="row"><span id="res">–</span></div>
    <div id="stat"></div>
  </div>
  <div id="chartWrap"><canvas id="chart"></canvas></div>
  <div id="binTable"></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let mode='B', fontSize=13, fontBold=false, fontItalic=false;
function applyFont(){ const r=document.documentElement.style; r.setProperty('--fs',(fontSize||13)+'px'); r.setProperty('--fw',fontBold?'700':'400'); r.setProperty('--fwh',fontBold?'900':'700'); r.setProperty('--fwm',fontBold?'800':'600'); r.setProperty('--fi',fontItalic?'italic':'normal'); }
const fontPrefix=()=>(fontItalic?'italic ':'')+(fontBold?'bold ':'');
const cv=$('chart'), ctx=cv.getContext('2d'); let dpr=Math.max(1,window.devicePixelRatio||1);
function lgamma(z){ const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5) return Math.log(Math.PI/Math.sin(Math.PI*z))-lgamma(1-z); z-=1; let x=c[0]; for(let i=1;i<g+2;i++)x+=c[i]/(z+i); const t=z+g+0.5; return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x); }
function binPmf(n,k,p){ if(k<0||k>n)return 0; if(p<=0)return k===0?1:0; if(p>=1)return k===n?1:0; return Math.exp(lgamma(n+1)-lgamma(k+1)-lgamma(n-k+1)+k*Math.log(p)+(n-k)*Math.log(1-p)); }
function erf(x){ const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x); const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return s*y; }
const normCDF=(x,mu,sig)=>0.5*(1+erf((x-mu)/(sig*Math.SQRT2)));
const normPdf=(x,mu,sig)=>Math.exp(-0.5*((x-mu)/sig)**2)/(sig*Math.sqrt(2*Math.PI));
function fmt(v){ if(!isFinite(v))return '–'; return (Math.round(v*1e6)/1e6).toString(); }

let region={a:0,b:0}; // hervorgehobener Bereich
function compute(){
  if(mode==='B'){
    const n=Math.max(1,Math.round(+$('n').value||1)), p=Math.min(1,Math.max(0,+$('p').value||0)), op=$('opB').value;
    let k=Math.round(+$('kB').value||0), k2=Math.round(+$('kB2').value||0); $('kB2wrap').style.display=op==='zw'?'inline':'none';
    const cum=m=>{ let s=0; for(let i=0;i<=m;i++)s+=binPmf(n,i,p); return s; };
    let P=0, a=0, b=0;
    if(op==='='){ P=binPmf(n,k,p); a=k;b=k; }
    else if(op==='≤'){ P=cum(k); a=0;b=k; }
    else if(op==='<'){ P=cum(k-1); a=0;b=k-1; }
    else if(op==='≥'){ P=1-cum(k-1); a=k;b=n; }
    else if(op==='>'){ P=1-cum(k); a=k+1;b=n; }
    else { if(k2<k)[k,k2]=[k2,k]; P=cum(k2)-cum(k-1); a=k;b=k2; }
    region={a,b}; $('res').textContent='P = '+fmt(P); $('stat').textContent='μ = n·p = '+fmt(n*p)+'   ·   σ = √(n·p·(1−p)) = '+fmt(Math.sqrt(n*p*(1-p)));
    drawBin(n,p); buildBinTable(n,p);
  } else {
    const mu=+$('mu').value||0, sig=Math.max(1e-6,+$('sig').value||1), op=$('opN').value;
    let x=+$('xN').value||0, x2=+$('xN2').value||0; $('xN2wrap').style.display=op==='zw'?'inline':'none';
    let P=0, a=-Infinity, b=Infinity;
    if(op==='≤'){ P=normCDF(x,mu,sig); a=-Infinity;b=x; }
    else if(op==='≥'){ P=1-normCDF(x,mu,sig); a=x;b=Infinity; }
    else { if(x2<x)[x,x2]=[x2,x]; P=normCDF(x2,mu,sig)-normCDF(x,mu,sig); a=x;b=x2; }
    region={a,b}; $('res').textContent='P = '+fmt(P); $('stat').textContent='μ = '+fmt(mu)+'   ·   σ = '+fmt(sig);
    drawNorm(mu,sig);
  }
  sync();
}
function sz(){ dpr=Math.max(1,window.devicePixelRatio||1); cv.width=Math.round(cv.clientWidth*dpr); cv.height=Math.round(cv.clientHeight*dpr); }
const labFont=()=>Math.max(9,fontSize-3);
const padBot=()=>Math.max(22, labFont()+14);        // Platz für die Achsenbeschriftung – wächst mit der Schrift
function drawBin(n,p){ sz(); const W=cv.clientWidth,H=cv.clientHeight; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const pad=22, pb=padBot(), base=H-pb, bw=(W-2*pad)/(n+1); let mx=0; const pm=[]; for(let k=0;k<=n;k++){ pm[k]=binPmf(n,k,p); mx=Math.max(mx,pm[k]); }
  for(let k=0;k<=n;k++){ const h=(pm[k]/mx)*Math.max(4,base-pad); const x=pad+k*bw, y=base-h;
    ctx.fillStyle=(k>=region.a&&k<=region.b)?'#2563eb':'#c3d4ef'; ctx.fillRect(x+1,y,Math.max(1,bw-2),h); }
  ctx.strokeStyle='#c9d2df'; ctx.beginPath(); ctx.moveTo(pad,base); ctx.lineTo(W-pad,base); ctx.stroke();
  ctx.fillStyle='#8a93a2'; ctx.font=fontPrefix()+labFont()+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  // Schrittweite so wählen, dass sich die Zahlen auch bei großer Schrift nicht überlappen
  const wLab=ctx.measureText(String(n)).width+8;
  const stepK=Math.max(1, Math.ceil((n+1)/12), Math.ceil(wLab/bw));
  for(let k=0;k<=n;k+=stepK) ctx.fillText(k, pad+k*bw+bw/2, base+6);
  ctx.textBaseline='alphabetic'; }
function drawNorm(mu,sig){ sz(); const W=cv.clientWidth,H=cv.clientHeight; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const pad=22, pb=padBot(), base=H-pb, xmin=mu-4*sig, xmax=mu+4*sig, mxY=normPdf(mu,mu,sig);
  const X=x=>pad+(x-xmin)/(xmax-xmin)*(W-2*pad), Y=y=>base-(y/mxY)*Math.max(4,base-pad);
  // Fläche
  ctx.fillStyle='rgba(37,99,235,.22)'; ctx.beginPath(); const a=Math.max(xmin,region.a), b=Math.min(xmax,region.b);
  ctx.moveTo(X(a),Y(0)); for(let x=a;x<=b;x+=(xmax-xmin)/300) ctx.lineTo(X(x),Y(normPdf(x,mu,sig))); ctx.lineTo(X(b),Y(0)); ctx.closePath(); ctx.fill();
  // Kurve
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2; ctx.beginPath(); for(let px=0;px<=(W-2*pad);px++){ const x=xmin+px/(W-2*pad)*(xmax-xmin); const yy=Y(normPdf(x,mu,sig)); if(px===0)ctx.moveTo(pad+px,yy); else ctx.lineTo(pad+px,yy); } ctx.stroke();
  ctx.strokeStyle='#c9d2df'; ctx.beginPath(); ctx.moveTo(pad,base); ctx.lineTo(W-pad,base); ctx.stroke();
  ctx.strokeStyle='#e0e6ef'; ctx.beginPath(); ctx.moveTo(X(mu),pad); ctx.lineTo(X(mu),base); ctx.stroke();
  ctx.fillStyle='#8a93a2'; ctx.font=fontPrefix()+labFont()+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  // nur so viele σ-Marken beschriften, wie nebeneinander Platz haben
  let wMax=0; for(let i=-3;i<=3;i++) wMax=Math.max(wMax, ctx.measureText(fmt(mu+i*sig)).width);
  const stepI=Math.max(1, Math.ceil((wMax+8)/((W-2*pad)/8)));   // die Skala umfasst 8σ über die Breite
  for(let i=-3;i<=3;i++){ if(i%stepI)continue; const x=mu+i*sig; ctx.fillText(fmt(x), X(x), base+6); }
  ctx.textBaseline='alphabetic'; }

function buildBinTable(n,p){ let cum=0, h='<table class="vt"><tr><th>k</th><th>P(X=k)</th><th>P(X≤k)</th></tr>';
  for(let k=0;k<=n;k++){ const pk=binPmf(n,k,p); cum+=pk; const hl=(k>=region.a&&k<=region.b)?' class="hl"':'';
    h+='<tr'+hl+'><td>'+k+'</td><td>'+(Math.round(pk*1e6)/1e6)+'</td><td>'+(Math.round(cum*1e6)/1e6)+'</td></tr>'; }
  $('binTable').innerHTML=h+'</table>'; }
$('tabB').onclick=()=>{ mode='B'; $('tabB').classList.add('on'); $('tabN').classList.remove('on'); $('pB').style.display=''; $('pN').style.display='none'; $('binTable').style.display='block'; compute(); };
$('tabN').onclick=()=>{ mode='N'; $('tabN').classList.add('on'); $('tabB').classList.remove('on'); $('pN').style.display=''; $('pB').style.display='none'; $('binTable').style.display='none'; compute(); };
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',compute));
addEventListener('resize',()=>{ mode==='B'?drawBin(Math.max(1,Math.round(+$('n').value||1)),Math.min(1,Math.max(0,+$('p').value||0))):drawNorm(+$('mu').value||0,Math.max(1e-6,+$('sig').value||1)); });

function collect(){ return { mode, n:$('n').value,p:$('p').value,opB:$('opB').value,kB:$('kB').value,kB2:$('kB2').value, mu:$('mu').value,sig:$('sig').value,opN:$('opN').value,xN:$('xN').value,xN2:$('xN2').value, fontSize, fontBold, fontItalic }; }
function sync(){ try{ parent.postMessage({type:'embed-data',data:collect()},'*'); }catch(e){} }
addEventListener('message',e=>{ if(e.data&&e.data.type==='embed-data'&&e.data.data){ const d=e.data.data;
  ['n','p','kB','kB2','mu','sig','xN','xN2'].forEach(id=>{ if(d[id]!==undefined)$(id).value=d[id]; });
  if(d.opB)$('opB').value=d.opB; if(d.opN)$('opN').value=d.opN;
  if(d.fontSize)fontSize=d.fontSize; fontBold=!!d.fontBold; fontItalic=!!d.fontItalic; applyFont();
  if(d.mode==='N'){ $('tabN').onclick(); } else { $('tabB').onclick(); } } });
window.addEventListener('load',()=>{ applyFont(); if(mode==='B')$('binTable').style.display='block'; compute(); try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
</script>
</body>
</html>
