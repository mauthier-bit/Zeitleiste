<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tabelle</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#1f2430;overflow:auto;}
  #wrap{padding:0;height:100%;}
  table{border-collapse:collapse;width:100%;height:100%;table-layout:fixed;}
  td{border:var(--bw,1px) solid #9aa7b8;padding:0;}
  input{width:100%;height:100%;min-height:34px;border:0;text-align:center;font-size:var(--fs,15px);font-weight:var(--fw,400);font-style:var(--fi,normal);font-family:inherit;background:transparent;padding:6px 4px;color:inherit;}
  input:focus{outline:2px solid #3b82f6;outline-offset:-2px;}
  tr:first-child td{background:#f2f5f9;}
  tr:first-child input{font-weight:var(--fwh,700);}
</style>
</head>
<body>
<div id="wrap"><table id="tbl"></table></div>
<script>
"use strict";
let data={ rows:3, cols:3, cells:{}, fontSize:15, lineWidth:1, fontBold:false, fontItalic:false };
function cellKey(r,c){ return r+'_'+c; }
function applyFont(){ const r=document.documentElement.style; r.setProperty('--fs',(data.fontSize||15)+'px'); r.setProperty('--bw',(data.lineWidth||1)+'px'); r.setProperty('--fw',data.fontBold?'700':'400'); r.setProperty('--fwh',data.fontBold?'900':'700'); r.setProperty('--fwm',data.fontBold?'800':'600'); r.setProperty('--fi',data.fontItalic?'italic':'normal'); }
function build(){ applyFont();
  const rows=Math.max(1,Math.min(30,data.rows||3)), cols=Math.max(1,Math.min(20,data.cols||3));
  data.rows=rows; data.cols=cols;
  let h='';
  for(let r=0;r<rows;r++){ h+='<tr>'; for(let c=0;c<cols;c++){ const v=(data.cells[cellKey(r,c)]||'').replace(/"/g,'&quot;'); h+='<td><input data-r="'+r+'" data-c="'+c+'" value="'+v+'"></td>'; } h+='</tr>'; }
  document.getElementById('tbl').innerHTML=h;
  document.querySelectorAll('#tbl input').forEach(inp=>inp.addEventListener('input',()=>{ const k=cellKey(inp.dataset.r,inp.dataset.c); if(inp.value)data.cells[k]=inp.value; else delete data.cells[k]; sync(); }));
}
function sync(){ try{ parent.postMessage({type:'embed-data',data},'*'); }catch(e){} }
addEventListener('message',e=>{ if(e.data&&e.data.type==='embed-data'&&e.data.data){ const d=e.data.data;
  data={ rows:d.rows||3, cols:d.cols||3, cells:d.cells||{}, fontSize:d.fontSize||15, lineWidth:d.lineWidth||1, fontBold:!!d.fontBold, fontItalic:!!d.fontItalic }; build(); } });
window.addEventListener('load',()=>{ build(); try{ parent.postMessage({type:'embed-ready'},'*'); }catch(e){} });
</script>
</body>
</html>
